<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- iPhone bezel background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F998B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E5A56;stop-opacity:1" />
    </linearGradient>
    <style>
      .caption-line { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.5; }
      .speaker-1 { fill: #EFC587; }
      .speaker-2 { fill: #5ECFC4; }
      .dimmed { opacity: 0.6; }
    </style>
  </defs>

  <!-- Phone body -->
  <rect width="375" height="812" rx="40" fill="url(#grad1)"/>

  <!-- Screen -->
  <rect x="10" y="50" width="355" height="712" rx="30" fill="#FBE8C1"/>

  <!-- Status bar -->
  <rect x="10" y="50" width="355" height="44" rx="30" fill="#1F998B"/>
  <text x="187.5" y="72" text-anchor="middle" fill="#FBE8C1" font-size="12" font-weight="600">9:41</text>

  <!-- Caption stream title -->
  <text x="20" y="110" font-size="14" font-weight="600" fill="#0E5A56" class="caption-line">Live Captions</text>

  <!-- Sample caption stream with speakers -->
  <g class="caption-line">
    <!-- Speaker 1: "Thanks for joining." -->
    <rect x="15" y="125" width="345" height="auto" rx="8" fill="#EFC587" opacity="0.2"/>
    <text x="25" y="142" font-size="12" font-weight="600" fill="#0E5A56">Speaker 1</text>
    <text x="25" y="162" font-size="16" fill="#0E5A56">Thanks for joining.</text>

    <!-- Speaker 2: "Happy to be here!" -->
    <rect x="15" y="185" width="345" height="auto" rx="8" fill="#5ECFC4" opacity="0.2"/>
    <text x="25" y="202" font-size="12" font-weight="600" fill="#0E5A56">Speaker 2</text>
    <text x="25" y="222" font-size="16" fill="#0E5A56">Happy to be here!</text>

    <!-- Speaker 1: "How was your week?" -->
    <rect x="15" y="245" width="345" height="auto" rx="8" fill="#EFC587" opacity="0.2"/>
    <text x="25" y="262" font-size="12" font-weight="600" fill="#0E5A56">Speaker 1</text>
    <text x="25" y="282" font-size="16" fill="#0E5A56">How was your week?</text>

    <!-- Dimmed/low confidence speech -->
    <rect x="15" y="305" width="345" height="auto" rx="8" fill="#9F9F9F" opacity="0.1"/>
    <text x="25" y="322" font-size="12" font-weight="600" fill="#0E5A56" opacity="0.6">Speaker 2</text>
    <text x="25" y="342" font-size="16" fill="#0E5A56" opacity="0.5">Pretty good, pretty busy...</text>

    <!-- Control bar at bottom -->
    <rect x="15" y="720" width="345" height="30" rx="6" fill="#1F998B"/>
    <text x="187.5" y="741" text-anchor="middle" fill="#FBE8C1" font-size="14" font-weight="600">Stop Captioning</text>
  </g>

  <!-- Label -->
  <text x="187.5" y="795" text-anchor="middle" font-size="11" fill="#0E5A56" opacity="0.6">Sample caption display with multiple speakers</text>
</svg>
