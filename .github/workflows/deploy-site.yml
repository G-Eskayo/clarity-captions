name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'site-src/**'
      - 'scripts/**'
      - 'docs/research/evidence/**'
      - 'Apps/Spike/StoreKit/**'
      - 'Apps/Spike/Sources/TranslationCenter.swift'
      - '.github/workflows/deploy-site.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: .github/run-check.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
