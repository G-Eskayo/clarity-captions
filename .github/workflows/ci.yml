name: CI

# Runs on every PR and on main. This is the same check the MARVIN pipeline and merge gate run locally
# (see config/projects/clarity-captions.json): CaptionCore's unit tests, the app building for the iOS Simulator, and the Mac app building.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caption-core:
    name: CaptionCore unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: Packages/CaptionCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/CaptionCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: swift test
        working-directory: Packages/CaptionCore
        run: swift test

  spike-app:
    name: App builds (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cache the bundled models (speaker + Parakeet, about 740 MB, gitignored)
        id: model
        uses: actions/cache@v4
        with:
          path: Apps/Spike/Resources/Models
          key: bundled-models-${{ hashFiles('scripts/fetch-diarizer-models.sh', 'scripts/fetch-asr-models.sh', 'scripts/models/*.sha256') }}
      - name: Fetch the speaker and Parakeet models
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          sh scripts/fetch-diarizer-models.sh
          sh scripts/fetch-asr-models.sh
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate the project and build (signing off)
        working-directory: Apps/Spike
        run: |
          xcodegen generate
          xcodebuild -project CaptionSpike.xcodeproj -scheme CaptionSpike \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  # #209: the Mac app shares the iPhone's Settings files, so a change to them can break the Mac. Build it every time.
  mac-app:
    name: Mac app builds (macOS)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cache the bundled speaker model (Sortformer, about 230 MB, gitignored)
        id: model
        uses: actions/cache@v4
        with:
          path: Apps/Mac/Resources/Models
          key: mac-models-${{ hashFiles('scripts/fetch-diarizer-models.sh') }}
      - name: Fetch the speaker model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          sh scripts/fetch-diarizer-models.sh
          mkdir -p Apps/Mac/Resources/Models
          mv Apps/Spike/Resources/Models/Sortformer_v2.1.mlmodelc Apps/Mac/Resources/Models/
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate the project and build (signing off)
        working-directory: Apps/Mac
        run: |
          xcodegen generate
          xcodebuild -project CaptionMac.xcodeproj -scheme CaptionMac -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

  site:
    name: Website checks (site/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages match their sources (site-src, #207)
        run: node --test scripts/build-site.test.mjs scripts/lang-offer.test.mjs && node scripts/build-site.mjs --check
      - name: Nothing phones home, honest claims, contrast, links, demo logic
        run: node scripts/check-site.mjs
      - name: Evidence log entries (one file each, #210)
        run: node --test scripts/check-evidence.test.mjs && node scripts/check-evidence.mjs
