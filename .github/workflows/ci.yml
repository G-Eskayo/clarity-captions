name: CI

# Runs exactly the required checks in .github/required-checks.json (marvin#826): one job per check, named as the list
# names it, each running `.github/run-check.sh <id>`, the same runner MARVIN's merge gate uses. Branch protection on
# main requires these names; scripts/required-checks.test.mjs fails if this file and the list drift apart.
# On a PR, MARVIN_BASE makes each check run only when the change touches its paths (and skip its setup otherwise);
# on main, after every merge, it is empty and every check runs.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MARVIN_BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  caption-core:
    name: CaptionCore unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch CaptionCore?
        id: affected
        run: echo "run=$(.github/run-check.sh caption-core --affected)" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        if: steps.affected.outputs.run == 'true'
        run: swift --version && xcodebuild -version
      - name: Cache SwiftPM build
        if: steps.affected.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: Packages/CaptionCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/CaptionCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - run: .github/run-check.sh caption-core

  spike-app:
    name: App builds (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the app?
        id: affected
        run: echo "run=$(.github/run-check.sh spike-app --affected)" >> "$GITHUB_OUTPUT"
      - name: Cache the bundled models (speaker + Parakeet, about 740 MB, gitignored)
        if: steps.affected.outputs.run == 'true'
        id: model
        uses: actions/cache@v4
        with:
          path: Apps/Spike/Resources/Models
          key: bundled-models-${{ hashFiles('scripts/fetch-diarizer-models.sh', 'scripts/fetch-asr-models.sh', 'scripts/models/*.sha256') }}
      - name: Fetch the speaker and Parakeet models
        if: steps.affected.outputs.run == 'true' && steps.model.outputs.cache-hit != 'true'
        run: |
          sh scripts/fetch-diarizer-models.sh
          sh scripts/fetch-asr-models.sh
      - name: Install xcodegen
        if: steps.affected.outputs.run == 'true'
        run: brew install xcodegen
      - name: Generate the project and build (signing off)
        run: .github/run-check.sh spike-app

  # #209: the Mac app shares the iPhone's Settings files, so a change to them can break the Mac.
  mac-app:
    name: Mac app builds (macOS)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the Mac app?
        id: affected
        run: echo "run=$(.github/run-check.sh mac-app --affected)" >> "$GITHUB_OUTPUT"
      - name: Cache the bundled speaker model (Sortformer, about 230 MB, gitignored)
        if: steps.affected.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: Apps/Mac/Resources/Models
          key: mac-models-${{ hashFiles('scripts/fetch-diarizer-models.sh') }}
      - name: Install xcodegen
        if: steps.affected.outputs.run == 'true'
        run: brew install xcodegen
      - name: Generate the project and build (signing off; fetches the speaker model when the cache has none)
        run: .github/run-check.sh mac-app

  site:
    name: Website checks (site/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages match their sources, nothing phones home, evidence entries, the required-checks list
        run: .github/run-check.sh site
