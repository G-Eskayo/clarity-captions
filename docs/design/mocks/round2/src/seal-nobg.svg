<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Seal mascot rig: a vector redraw of design/icon/seal-icon-1024.png, split into parts that can move on their own.
       Palette (design/icon/README.md): teal #1F998B, cream #FBE8C1, peach #EFC587, deep teal #0E5A56.
       Pivots the launch animation uses (rig coordinates): whole seal (430,900) bottom of the body; front flipper
       (600,760); back flipper (120,600); near eye (357,472); far eye (630,329); mouth (565,585); rays (760,460).
       The front flipper is new (the icon shows only the back one) so the seal can clap and wave. -->
  
  <g id="seal-root">
    <g id="flipper-back">
      <ellipse cx="88" cy="598" rx="92" ry="50" transform="rotate(-38 88 598)" fill="#FBE8C1"/>
      <ellipse cx="60" cy="535" rx="38" ry="30" transform="rotate(-20 60 535)" fill="#FBE8C1"/>
    </g>
    <g id="body">
      <ellipse id="belly" cx="410" cy="612" rx="300" ry="298" fill="#EFC587"/>
      <circle id="head" cx="430" cy="505" r="322" fill="#FBE8C1"/>
    </g>
    <g id="cheeks" fill="#EFC587">
      <ellipse cx="705" cy="402" rx="36" ry="31"/>
      <ellipse cx="397" cy="578" rx="54" ry="32"/>
    </g>
    <g id="eyes">
      <g id="eye-near">
        <circle cx="357" cy="472" r="62" fill="#0E5A56"/>
        <circle class="shine" cx="362" cy="440" r="17" fill="#FBE8C1"/>
        <circle class="shine" cx="322" cy="471" r="9" fill="#FBE8C1"/>
      </g>
      <g id="eye-far">
        <ellipse cx="630" cy="329" rx="37" ry="40" fill="#0E5A56"/>
        <circle class="shine" cx="621" cy="309" r="11" fill="#FBE8C1"/>
        <circle class="shine" cx="604" cy="330" r="5" fill="#FBE8C1"/>
      </g>
    </g>
    <ellipse id="nose" cx="568" cy="430" rx="57" ry="33" transform="rotate(-18 568 430)" fill="#0E5A56"/>
    <g id="mouth">
      <path d="M487 580 C540 592 602 560 642 508 L634 606 C628 648 590 668 558 656 C528 644 505 614 487 580 Z" fill="#0E5A56"/>
      <ellipse cx="586" cy="624" rx="47" ry="25" transform="rotate(-12 586 624)" fill="#EFC587"/>
    </g>
    <g id="whiskers" stroke="#0E5A56" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="450" y1="560" x2="318" y2="572"/>
      <line x1="450" y1="564" x2="320" y2="607"/>
      <line x1="452" y1="567" x2="342" y2="636"/>
    </g>
    <g id="flipper-front">
      <ellipse cx="662" cy="782" rx="100" ry="44" transform="rotate(-32 662 782)" fill="#FBE8C1"/>
      <path d="M612 800 Q660 778 712 752" stroke="#EFC587" stroke-width="10" stroke-linecap="round" fill="none"/>
    </g>
    <g id="rays" stroke="#FBE8C1" stroke-width="34" stroke-linecap="round">
      <line x1="760" y1="345" x2="870" y2="197"/>
      <line x1="808" y1="462" x2="963" y2="385"/>
      <line x1="818" y1="578" x2="962" y2="578"/>
    </g>
  </g>
</svg>
