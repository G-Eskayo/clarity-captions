<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Two colors only: BG #0E4D64 and FG #F6EFE0. Full-bleed square; iOS applies the rounded mask. -->
  <rect width="1024" height="1024" fill="#0E4D64"/>
  <g transform="translate(20 70) scale(0.86)">
    <g fill="#F6EFE0">
      <!-- body: fat comma, widest at the belly, tapering to the tail -->
      <ellipse cx="470" cy="760" rx="215" ry="250" transform="rotate(14 470 760)"/>
      <!-- tail flipper -->
      <path d="M 300 930 C 230 960, 170 950, 120 905 C 175 905, 215 885, 255 850 Z"/>
      <!-- neck -->
      <ellipse cx="505" cy="560" rx="135" ry="190" transform="rotate(8 505 560)"/>
      <!-- head -->
      <ellipse cx="565" cy="395" rx="165" ry="150" transform="rotate(-18 565 395)"/>
      <!-- upper muzzle, tilted up: a seal's short blunt snout -->
      <ellipse cx="715" cy="320" rx="105" ry="62" transform="rotate(-27 715 320)"/>
      <!-- lower jaw, dropped open -->
      <ellipse cx="700" cy="425" rx="82" ry="38" transform="rotate(14 700 425)"/>
    </g>
    <!-- mouth: open gap between the jaws -->
    <path fill="#0E4D64" d="M 690 372 L 835 330 L 815 405 Z"/>
    <!-- front flipper, set off from the body by a BG outline -->
    <path fill="#F6EFE0" stroke="#0E4D64" stroke-width="14" stroke-linejoin="round"
          d="M 560 600 C 640 620, 690 700, 670 790 C 650 770, 600 740, 560 690 C 535 660, 535 620, 560 600 Z"/>
    <!-- eye, nostril, whisker dots -->
    <circle cx="600" cy="355" r="22" fill="#0E4D64"/>
    <circle cx="805" cy="285" r="13" fill="#0E4D64"/>
    <g fill="#0E4D64"><circle cx="745" cy="318" r="7"/><circle cx="765" cy="332" r="7"/><circle cx="725" cy="335" r="7"/></g>
    <!-- three bark lines from the mouth -->
    <g fill="none" stroke="#F6EFE0" stroke-width="30" stroke-linecap="round">
      <path d="M 905 315 A 75 75 0 0 1 905 405"/>
      <path d="M 945 280 A 135 135 0 0 1 945 440"/>
      <path d="M 985 245 A 195 195 0 0 1 985 475"/>
    </g>
  </g>
</svg>
