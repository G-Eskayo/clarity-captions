<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Two colors only: BG #F6EFE0 and FG #0E4D64. Full-bleed square; iOS applies the rounded mask. -->
  <rect width="1024" height="1024" fill="#F6EFE0"/>
  <g transform="translate(28 10) scale(0.88)">
    <g fill="#0E4D64">
      <!-- body: short, sleek, sitting upright -->
      <ellipse cx="470" cy="760" rx="190" ry="250" transform="rotate(6 470 760)"/>
      <!-- tail flippers -->
      <path d="M 360 985 C 300 1020, 225 1010, 180 960 C 235 962, 285 945, 325 905 Z"/>
      <!-- neck and nape, so there is no notch behind the head -->
      <ellipse cx="480" cy="580" rx="150" ry="135"/>
      <ellipse cx="430" cy="500" rx="165" ry="120"/>
      <!-- big round head -->
      <ellipse cx="500" cy="400" rx="232" ry="206" transform="rotate(-8 500 400)"/>
      <!-- blunt muzzle, tipped up -->
      <ellipse cx="695" cy="372" rx="130" ry="92" transform="rotate(-14 695 372)"/>
      <!-- lower jaw, dropped open -->
      <ellipse cx="668" cy="530" rx="114" ry="52" transform="rotate(6 668 530)"/>
    </g>
    <!-- open mouth: wedge between muzzle and jaw, with a little tongue -->
    <path fill="#F6EFE0" d="M 652 488 C 652 462, 705 446, 838 418 C 854 466, 836 508, 802 515 C 742 526, 694 522, 652 488 Z"/>
    <ellipse cx="748" cy="497" rx="44" ry="19" fill="#0E4D64" transform="rotate(-8 748 497)"/>
    <!-- front flipper: a paddle, set off by a BG outline -->
    <path fill="#0E4D64" stroke="#F6EFE0" stroke-width="13" stroke-linejoin="round"
          d="M 540 640 C 515 705, 575 800, 635 838 C 690 862, 712 805, 668 762 C 628 722, 606 664, 590 632 Z"/>
    <!-- ear flap, set off by a BG outline -->
    <ellipse cx="338" cy="352" rx="30" ry="44" transform="rotate(-18 338 352)" fill="#0E4D64" stroke="#F6EFE0" stroke-width="11"/>
    <!-- big eye with a shine -->
    <circle cx="545" cy="330" r="38" fill="#F6EFE0"/>
    <circle cx="558" cy="316" r="12" fill="#0E4D64"/>
    <!-- round nose and whiskers -->
    <circle cx="795" cy="325" r="27" fill="#F6EFE0"/>
    <g stroke="#F6EFE0" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M 692 396 L 778 372"/><path d="M 694 418 L 786 414"/>
    </g>
    <!-- three bark lines from the mouth -->
    <g fill="none" stroke="#0E4D64" stroke-width="32" stroke-linecap="round">
      <path d="M 893 412 A 78 78 0 0 1 893 504"/>
      <path d="M 938 376 A 135 135 0 0 1 938 544"/>
      <path d="M 983 340 A 195 195 0 0 1 983 580"/>
    </g>
  </g>
</svg>
