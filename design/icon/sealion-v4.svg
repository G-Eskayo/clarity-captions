<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Two colors only: BG #0E4D64 and FG #F6EFE0. Full-bleed square; iOS applies the rounded mask. -->
  <rect width="1024" height="1024" fill="#0E4D64"/>
  <g transform="translate(28 10) scale(0.88)">
    <g fill="#F6EFE0">
      <!-- body: short, sleek, sitting upright -->
      <ellipse cx="470" cy="760" rx="190" ry="250" transform="rotate(6 470 760)"/>
      <!-- tail flippers -->
      <path d="M 360 985 C 300 1020, 225 1010, 180 960 C 235 962, 285 945, 325 905 Z"/>
      <!-- neck -->
      <ellipse cx="480" cy="580" rx="150" ry="135"/>
      <!-- big round head -->
      <ellipse cx="500" cy="400" rx="232" ry="206" transform="rotate(-8 500 400)"/>
      <!-- blunt muzzle, tipped up -->
      <ellipse cx="695" cy="372" rx="130" ry="92" transform="rotate(-14 695 372)"/>
      <!-- lower jaw, dropped open -->
      <ellipse cx="662" cy="525" rx="108" ry="46" transform="rotate(8 662 525)"/>
    </g>
    <!-- open mouth: wedge between muzzle and jaw, with a little tongue -->
    <path fill="#0E4D64" d="M 640 452 L 835 418 L 812 508 L 650 520 Z"/>
    <ellipse cx="735" cy="494" rx="46" ry="21" fill="#F6EFE0" transform="rotate(-6 735 494)"/>
    <!-- front flipper, set off by a BG outline -->
    <line x1="545" y1="650" x2="650" y2="815" stroke="#0E4D64" stroke-width="82" stroke-linecap="round"/>
    <line x1="545" y1="650" x2="650" y2="815" stroke="#F6EFE0" stroke-width="62" stroke-linecap="round"/>
    <!-- ear flap, set off by a BG outline -->
    <ellipse cx="338" cy="352" rx="30" ry="44" transform="rotate(-18 338 352)" fill="#F6EFE0" stroke="#0E4D64" stroke-width="11"/>
    <!-- big eye with a shine -->
    <circle cx="545" cy="330" r="38" fill="#0E4D64"/>
    <circle cx="558" cy="316" r="12" fill="#F6EFE0"/>
    <!-- round nose and whiskers -->
    <circle cx="795" cy="325" r="27" fill="#0E4D64"/>
    <g stroke="#0E4D64" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M 700 392 L 770 378"/><path d="M 702 412 L 775 410"/><path d="M 700 432 L 768 442"/>
    </g>
    <!-- three bark lines from the mouth -->
    <g fill="none" stroke="#F6EFE0" stroke-width="32" stroke-linecap="round">
      <path d="M 893 412 A 78 78 0 0 1 893 504"/>
      <path d="M 938 376 A 135 135 0 0 1 938 544"/>
      <path d="M 983 340 A 195 195 0 0 1 983 580"/>
    </g>
  </g>
</svg>
