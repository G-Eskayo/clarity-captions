<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
	<!-- iPhone frame background -->
	<rect width="390" height="844" fill="#000"/>

	<!-- Screen content area -->
	<rect x="0" y="0" width="390" height="844" rx="40" fill="#f6e4bf"/>

	<!-- Status bar -->
	<rect x="0" y="0" width="390" height="44" fill="#1F998B"/>
	<text x="195" y="30" font-family="system-ui" font-size="14" fill="white" text-anchor="middle" font-weight="500">9:41</text>

	<!-- Caption view title -->
	<text x="20" y="80" font-family="system-ui" font-size="18" font-weight="700" fill="#124F49">Listening</text>
	<circle cx="360" cy="70" r="8" fill="#1F998B"/>

	<!-- Caption stream -->
	<g id="captions">
		<!-- Speaker 1: Gil -->
		<circle cx="20" cy="130" r="6" fill="#1F998B"/>
		<text x="35" y="120" font-family="system-ui" font-size="12" font-weight="600" fill="#1F998B">Gil</text>
		<text x="35" y="145" font-family="system-ui" font-size="16" fill="#124F49" font-weight="500">Happy birthday, Mom.</text>
		<text x="35" y="165" font-family="system-ui" font-size="16" fill="#124F49" font-weight="500">Watch the screen while we talk.</text>

		<!-- Speaker 2: Dana -->
		<circle cx="20" cy="220" r="6" fill="#E8C27E"/>
		<text x="35" y="210" font-family="system-ui" font-size="12" font-weight="600" fill="#E8C27E">Dana</text>
		<text x="35" y="235" font-family="system-ui" font-size="16" fill="#124F49" font-weight="500">It's catching every word,</text>
		<text x="35" y="255" font-family="system-ui" font-size="16" fill="#124F49" font-weight="500">even from across the table.</text>

		<!-- Sound label -->
		<rect x="35" y="285" width="320" height="40" rx="8" fill="#f0faf8" stroke="#1F998B" stroke-width="1"/>
		<text x="195" y="315" font-family="system-ui" font-size="14" fill="#1F998B" text-anchor="middle" font-style="italic">[Laughter]</text>

		<!-- Speaker 1 again -->
		<circle cx="20" cy="360" r="6" fill="#1F998B"/>
		<text x="35" y="350" font-family="system-ui" font-size="12" font-weight="600" fill="#1F998B">Gil</text>
		<text x="35" y="375" font-family="system-ui" font-size="16" fill="#124F49" font-weight="500">And it works in airplane mode.</text>
		<text x="35" y="395" font-family="system-ui" font-size="16" fill="#124F49" font-weight="500">Nothing leaves the phone.</text>
	</g>

	<!-- Home indicator -->
	<rect x="155" y="820" width="80" height="5" rx="2.5" fill="#124F49"/>

	<!-- Text note below screenshot explaining it's a mockup -->
	<text x="195" y="880" font-family="system-ui" font-size="11" fill="#666" text-anchor="middle" font-style="italic">
		Live captions with speaker labels during a conversation.
	</text>
</svg>
