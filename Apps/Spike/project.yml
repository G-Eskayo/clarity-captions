# XcodeGen spec -- the .xcodeproj is generated, not committed. Spike app: exists to
# answer far-field mic accuracy on a real device, not to be the product.
name: CaptionSpike
options:
  bundleIdPrefix: com.gileskayo
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Filled in by scripts/generate-spike-project.sh from $DEVELOPMENT_TEAM or the gitignored Apps/Spike/.team,
    # so regenerating the project never loses signing and no personal team ID is committed.
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    # Single source for the user-visible name (ADR 0011). The bundle ID below is permanent once
    # the App Store Connect record exists (ADR 0011, "Bundle ID"): never change it after that.
    APP_DISPLAY_NAME: "Seal"
packages:
  CaptionCore:
    path: ../../Packages/CaptionCore
targets:
  CaptionSpike:
    type: application
    platform: iOS
    sources:
      - Sources
      # Pre-compiled speaker model, fetched by scripts/fetch-diarizer-models.sh (gitignored).
      # Not optional: `xcodegen generate` fails if it is missing, so a model-less build can't happen quietly.
      # Third-party license text ships inside the app so the credits screen works offline.
      - path: ../../NOTICE.md
        buildPhase: resources
      # Privacy manifest (#79): required-reason APIs the app and its statically linked packages use.
      # Upload is refused (ITMS-91053) without it.
      - path: Info/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Lettering fonts (#103, SIL OFL 1.1, license files alongside): registered by UIAppFonts in Info/LaunchInfo.plist.
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Models/Sortformer_v2.1.mlmodelc
        type: folder
        buildPhase: resources
      # (The latency fixture is NOT bundled: it is generated, not committed, and a missing bundled file breaks the build.
      #  The package's latency test generates its own audio. Re-add this only together with a committed fixture.)
    dependencies:
      - package: CaptionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gileskayo.captions
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad (ADR 0010 gate lifted)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Captions need the microphone to show what people nearby are saying."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Captions turn speech into on-screen text on this device."
        INFOPLIST_FILE: Info/LaunchInfo.plist   # launch screen colour; merged with the generated keys
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad must allow all four, or the upload is refused (ITMS-90474). iPhone keeps the list above.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
schemes:
  CaptionSpike:
    build:
      targets:
        CaptionSpike: all
    run:
      config: Release   # latency must be judged on an optimized build, not Debug under the debugger
