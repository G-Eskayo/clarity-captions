# XcodeGen spec -- the .xcodeproj is generated, not committed. Mac companion app.
# Reuses the shared CaptionCore package (ADR 0010) -- platform-agnostic logic unchanged.
name: CaptionMac
options:
  bundleIdPrefix: com.gileskayo
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    APP_DISPLAY_NAME: "Seal Speak"
packages:
  CaptionCore:
    path: ../../Packages/CaptionCore
targets:
  CaptionMac:
    type: application
    platform: macOS
    sources:
      - Sources
      - Assets.xcassets
      # Seal Speak's look, shared with the iPhone app rather than copied (#172 pop-up).
      - path: ../Spike/Sources/GummyButtonStyle.swift
      - path: ../Spike/Sources/CaptionStyle+SwiftUI.swift
      # iPhone parity (#172, owner ~10:10): the same Settings, Saved and credits screens, shared, not redrawn.
      - path: ../Spike/Sources/OneScreenPieces.swift
      - path: ../Spike/Sources/SettingsPage.swift
      - path: ../Spike/Sources/SavedConversationsView.swift
      - path: ../Spike/Sources/SystemTextSizeCategory+DynamicTypeSize.swift
      - path: ../Spike/Sources/AboutCreditsView.swift
      # #178: Stop becomes the iPhone's small X with the iPhone's shrink animation, the same control.
      - path: ../Spike/Sources/MorphingControl.swift
      - path: ../Spike/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: ../../NOTICE.md
        buildPhase: resources
      - path: Resources/Models/Sortformer_v2.1.mlmodelc
        type: folder
        buildPhase: resources
    dependencies:
      - package: CaptionCore
      # #180 / #181: the red Listening light and the press feedback, shared with the iPhone.
      - package: CaptionCore
        product: CaptionUI
    info:
      path: Resources/Info.plist
      properties:
        # Call captions (#172): the Core Audio process tap needs "System Audio Recording". Without this key macOS
        # never asks and the tap delivers nothing.
        NSAudioCaptureUsageDescription: "Seal Speak listens to the call's sound so it can caption what the other person says."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gileskayo.captions.mac
        # The name in the Dock, the app menu, Finder and TestFlight; the target keeps its working name.
        PRODUCT_NAME: "Seal Speak"
        CODE_SIGN_ENTITLEMENTS: CaptionMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Its own App Store Connect record and price, not a Universal Purchase with iPhone/iPad (ADR 0028, #176).
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"   # 1.1 (3): headphones decide the mic (AirPods Max tested), switching live
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Captions need the microphone to show what people nearby are saying."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Captions turn speech into on-screen text on this device."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: CaptionMac-Debug.entitlements
schemes:
  CaptionMac:
    build:
      targets:
        CaptionMac: all
    run:
      config: Release
